name: Backend CI

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [master, develop]
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/backend-ci.yml"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # TODO: 移除 continue-on-error，待全量 ruff format 后启用严格检查
      - name: Ruff format check
        run: ruff format --check .
        continue-on-error: true

      # TODO: 移除 continue-on-error，待修复 UP035/UP006 旧式 typing 后启用严格检查
      - name: Ruff lint
        run: ruff check .
        continue-on-error: true

      - name: MyPy type check
        run: mypy domain/ application/ infrastructure/ interfaces/
        continue-on-error: true
