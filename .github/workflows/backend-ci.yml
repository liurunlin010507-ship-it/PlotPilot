name: Backend CI

on:
  pull_request:
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"
  push:
    branches: [master, develop]
    paths:
      - "**.py"
      - "requirements*.txt"
      - "pyproject.toml"
      - "pytest.ini"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check .

      - name: MyPy type check
        run: mypy domain/ application/ infrastructure/ interfaces/
        continue-on-error: true

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit \
            -v \
            --tb=short \
            --cov=domain \
            --cov=application \
            --cov=infrastructure \
            --cov=interfaces \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=html:htmlcov-unit \
            --junitxml=test-results-unit.xml
        env:
          ANTHROPIC_API_KEY: "test-placeholder"
          ARK_API_KEY: "test-placeholder"

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            test-results-unit.xml
            coverage-unit.xml
            htmlcov-unit/

  integration-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run integration tests with coverage
        run: |
          pytest tests/integration \
            -v \
            --tb=short \
            --cov=domain \
            --cov=application \
            --cov=infrastructure \
            --cov=interfaces \
            --cov-report=term-missing \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=html:htmlcov-integration \
            --junitxml=test-results-integration.xml
        env:
          ANTHROPIC_API_KEY: "test-placeholder"
          ARK_API_KEY: "test-placeholder"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: |
            test-results-integration.xml
            coverage-integration.xml
            htmlcov-integration/

  coverage-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install coverage tools
        run: pip install coverage pytest-cov

      - name: Download unit artifacts
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: artifacts/unit/

      - name: Download integration artifacts
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/integration/

      - name: Combine and report coverage
        run: |
          coverage combine artifacts/unit/coverage-unit.xml artifacts/integration/coverage-integration.xml || true
          coverage report --fail-under=60 || echo "::warning::Coverage below 60% threshold"
          coverage xml -o coverage-combined.xml || true

      - name: Coverage comment on PR
        if: github.event_name == 'pull_request'
        uses: py-cov-action/python-coverage-comment-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINIMUM_GREEN: 80
          MINIMUM_ORANGE: 60
